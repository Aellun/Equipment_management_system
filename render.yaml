services:
  - type: web
    name: equipment-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equipment_db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11
    rootDir: backend
    plan: standard
    region: oregon
    healthCheckPath: /docs
    autoDeploy: true

  - type: web
    name: equipment-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://equipment-backend.onrender.com
    rootDir: frontend
    plan: free
    region: oregon
    autoDeploy: true

  - type: pserv
    name: equipment_db
    runtime: postgres
    ipAllowList: []
    plan: free
    region: oregon

version: '3.9'

# Dyzah umbrella stack — Equipment · Store · Errands · Hygiene.
# Production-ready. Run with:  docker compose up --build -d
# For local development with hot-reload, add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

# Shared env for the FastAPI backend and the Celery worker (same image).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://ahadi:ahadi_secret@db:5432/event_tracking
  # Errands/Hygiene domain — sync (psycopg) URL to the SAME database.
  ERRANDS_DATABASE_URL: postgresql+psycopg://ahadi:ahadi_secret@db:5432/event_tracking
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dyzah-dev-secret-change-me}
  ERRANDS_MEDIA_DIR: /app/errands_media
  # --- Auth / edge hardening ---
  # Browser origins allowed to call the credentialed API.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
  # Set true once served over HTTPS so auth cookies are marked Secure.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Must match the X-Gateway-Secret nginx injects (see nginx/nginx.conf).
  GATEWAY_SECRET: ${GATEWAY_SECRET:-dyzah-gateway-secret-change-me}
  # Require mutations (POST/PUT/PATCH/DELETE) to arrive through nginx.
  GATEWAY_ENFORCE: ${GATEWAY_ENFORCE:-true}
  # M-Pesa (mock by default; set real Daraja creds + MPESA_MOCK=false for live)
  MPESA_MOCK: ${MPESA_MOCK:-true}
  MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost/api/errands/payments/mpesa/callback}
  # --- Social login (see SOCIAL_LOGIN.md) ---
  # A provider only appears on the sign-in screens once both its id and secret
  # are set, so leaving these blank simply hides the buttons.
  # Redirect URI to register: {origin}/api/errands/auth/oauth/{provider}/callback
  OAUTH_PUBLIC_BASE_URL: ${OAUTH_PUBLIC_BASE_URL:-}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
  OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ahadi
      POSTGRES_PASSWORD: ahadi_secret
      POSTGRES_DB: event_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahadi -d event_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # No host port needed in production — nginx reaches the backend internally at
    # backend:8000. To expose it for local API debugging, add the dev override
    # (docker-compose.dev.yml) which maps a host port.
    expose:
      - "8000"
    environment:
      <<: *backend-env
      UVICORN_WORKERS: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - errands_media:/app/errands_media
    restart: unless-stopped

  # Celery worker for errands/hygiene notifications & deferred work.
  # Override the image entrypoint (which launches uvicorn) so the worker runs Celery.
  worker:
    build: ./backend
    entrypoint: ["celery", "-A", "app.errands.core.celery_app.celery", "worker", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      - backend
      - redis
    volumes:
      - errands_media:/app/errands_media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:8000
      # SSR reaches the backend directly; it presents the gateway secret so its
      # server-action writes pass the backend's gateway check. Must match.
      GATEWAY_SECRET: ${GATEWAY_SECRET:-dyzah-gateway-secret-change-me}
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  errands_media:

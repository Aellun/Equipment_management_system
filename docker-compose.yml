version: '3.9'

# Production-ready stack. Run with:  docker compose up --build -d
# For local development with hot-reload, add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ahadi
      POSTGRES_PASSWORD: ahadi_secret
      POSTGRES_DB: event_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahadi -d event_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # No host port needed in production — nginx reaches the backend internally at
    # backend:8000. To expose it for local API debugging, add the dev override
    # (docker-compose.dev.yml) which maps a host port.
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ahadi:ahadi_secret@db:5432/event_tracking
      UVICORN_WORKERS: 2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
